<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2c58">
  <title>Imam Nur Hidayat | CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0c2c58;--ink:#15243a;--muted:#657287;--line:#e3e8f0;--paper:#f5f7fb}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper)}
    .cvbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px max(18px,calc((100vw - 1160px)/2));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .cv-brand{font:800 14px 'Manrope',sans-serif;color:var(--navy)}.cv-actions{display:flex;gap:10px;align-items:center}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}.button-primary{background:var(--navy);color:white;border-color:var(--navy)}.button-secondary{background:white;color:var(--navy)}
    .cv-main{width:min(1100px,calc(100% - 32px));margin:24px auto 42px}.cv-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;color:var(--muted);font-size:12px}.cv-viewer{width:100%;height:calc(100vh - 150px);min-height:680px;display:block;border:1px solid var(--line);border-radius:12px;background:white;box-shadow:0 14px 40px rgba(12,44,88,.08)}
    @media(max-width:600px){.cvbar{padding:11px 12px;align-items:flex-start}.cv-brand{font-size:11px;padding-top:10px}.cv-actions{gap:6px}.button{padding:10px 11px;font-size:10px}.cv-main{width:calc(100% - 18px);margin-top:12px}.cv-viewer{height:calc(100vh - 118px);min-height:520px}.cv-note{font-size:10px}}
  </style>
</head>
<body>
  <header class="cvbar">
    <a class="cv-brand" href="index.html">IMAM NUR HIDAYAT · CV</a>
    <div class="cv-actions">
      <a class="button button-secondary" href="index.html">← Back to Home</a>
      <a class="button button-primary" href="Imam-Nur-Hidayat-CV.pdf" download>Download CV ↓</a>
    </div>
  </header>
  <main class="cv-main">
    <p class="cv-note"><span>Curriculum Vitae</span><span>Use the download button to save a copy.</span></p>
    <iframe class="cv-viewer" title="Imam Nur Hidayat CV PDF" src="Imam-Nur-Hidayat-CV.pdf#toolbar=1&navpanes=0"></iframe>
  </main>
</body>
</html>
